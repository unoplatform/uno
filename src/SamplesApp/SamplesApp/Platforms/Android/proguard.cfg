# AndroidLinkTool is pinned to r8 (see SamplesApp.csproj) to dodge a d8 desugaring crash, but
# with AndroidLinkMode=None the SDK never generates proguard_project_references.cfg -- the file
# that carries the auto-generated keep rules for JNI-referenced types (build emits XA4304).
# R8 therefore shrinks with no keep rules at all and strips every AndroidX class that only
# managed code reaches through JNI (androidx.core.splashscreen.SplashScreen,
# androidx.activity.EdgeToEdge, the kotlinx.coroutines Main dispatcher behind androidx.window...).
# Keep R8 as the dexer/desugarer, but let it do exactly that and nothing else.
-dontshrink
-dontoptimize
-dontobfuscate
