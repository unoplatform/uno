parameters:
  xCodeRoot: ''
  # Apple platform to prepare a simulator runtime for, as `xcodebuild -downloadPlatform` and
  # `simctl list runtimes` name it (iOS, tvOS). Defaults keep every existing iOS caller unchanged.
  platform: 'iOS'
  simulatorSdk: 'iphonesimulator'

steps:
  - bash: |
      set -e
      echo 'xCode Root to ${{parameters.xCodeRoot}}'
      echo '##vso[task.setvariable variable=MD_APPLE_SDK_ROOT;]'${{parameters.xCodeRoot}}
      sudo xcode-select --switch ${{parameters.xCodeRoot}}/Contents/Developer
      sudo xcodebuild -runFirstLaunch
      # Verify expected ${{parameters.platform}} simulator runtime; download only if missing.
      SDK_BUILD_VERSION=$(xcrun --sdk ${{parameters.simulatorSdk}} --show-sdk-build-version 2>/dev/null || true)
      SDK_VERSION=$(xcrun --sdk ${{parameters.simulatorSdk}} --show-sdk-version 2>/dev/null || true)
      if [ -n "$SDK_BUILD_VERSION" ]; then
        echo "${{parameters.platform}} simulator SDK build version: $SDK_BUILD_VERSION"
      fi
      if [ -n "$SDK_VERSION" ]; then
        echo "${{parameters.platform}} simulator SDK version: $SDK_VERSION"
      fi
      if [ -n "$SDK_BUILD_VERSION" ]; then
        if xcrun simctl list runtimes | grep -Fq "${{parameters.platform}} $SDK_BUILD_VERSION"; then
          echo "Required ${{parameters.platform}} simulator runtime already installed."
          exit 0
        fi
      elif [ -n "$SDK_VERSION" ]; then
        if xcrun simctl list runtimes | grep -Fq "${{parameters.platform}} $SDK_VERSION"; then
          echo "Required ${{parameters.platform}} simulator runtime already installed."
          exit 0
        fi
      elif xcrun simctl list runtimes | grep -q "${{parameters.platform}}"; then
        echo "${{parameters.platform}} simulator runtime already installed."
        exit 0
      fi

      # Required runtime missing, attempt download.
      {
        echo "${{parameters.platform}} simulator runtime missing, downloading."
        DOWNLOAD_SUCCESS=false
        for attempt in 1 2 3; do
          if sudo xcodebuild -downloadPlatform ${{parameters.platform}}; then
            DOWNLOAD_SUCCESS=true
            break
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Download failed (attempt $attempt). Retrying in 30s..."
            sudo xcodebuild -runFirstLaunch
            sleep 30
          fi
        done
        if [ "$DOWNLOAD_SUCCESS" != "true" ]; then
          echo "Download failed after $attempt attempts."
          echo "${{parameters.platform}} simulator runtime download did not complete successfully."
          xcrun simctl list runtimes || true
          exit 1
        fi
        if [ -n "$SDK_BUILD_VERSION" ] && xcrun simctl list runtimes | grep -Fq "${{parameters.platform}} $SDK_BUILD_VERSION"; then
          echo "Required ${{parameters.platform}} simulator runtime now installed."
        elif [ -n "$SDK_VERSION" ] && xcrun simctl list runtimes | grep -Fq "${{parameters.platform}} $SDK_VERSION"; then
          echo "Required ${{parameters.platform}} simulator runtime now installed."
        elif [ -z "$SDK_BUILD_VERSION" ] && [ -z "$SDK_VERSION" ] && xcrun simctl list runtimes | grep -q "${{parameters.platform}}"; then
          echo "${{parameters.platform}} simulator runtime now installed."
        else
          echo "${{parameters.platform}} simulator runtime still missing after download attempts."
          xcrun simctl list runtimes
          exit 1
        fi
      }

    displayName: Select Xcode
