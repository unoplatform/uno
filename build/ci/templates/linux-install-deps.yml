parameters:
  # Default is the Skia desktop set. These are load-bearing: the X11 host dlopens unversioned
  # sonames (libvlc.so, libwebkit2gtk-4.1.so, libgdk-3.so) that only the -dev packages symlink.
  packages: 'xvfb fluxbox vlc libvlc-dev libgtk-3-dev libwebkit2gtk-4.1-dev'

steps:

  - bash: |
      # Used to improve the install performance, since we don't need man
      set -e
      # Divert /usr/bin/mandb to avoid package ownership conflicts
      sudo dpkg-divert --local --rename --add /usr/bin/mandb
      # Replace with a no-op
      echo '#!/bin/sh' | sudo tee /usr/bin/mandb >/dev/null
      echo 'exit 0' | sudo tee -a /usr/bin/mandb >/dev/null
      sudo chmod 755 /usr/bin/mandb
    displayName: Disable man-db

  # The packages a job needs, resolved offline from the image's pre-baked indexes. Keying the cache
  # on the exact .deb file names means a new image version rolls the key over by itself, instead of
  # restoring debs that no longer match its indexes.
  - bash: |
      set -uo pipefail

      packages="${{ parameters.packages }}"

      missing=""
      for package in $packages; do
        if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "ok installed"; then
          missing="$missing $package"
        fi
      done

      echo "##vso[task.setvariable variable=UNO_APT_MISSING]$missing"

      if [ -z "$missing" ]; then
        echo "Already installed, nothing to do: $packages"
        exit 0
      fi

      debs=$(timeout 2m apt-get install -y -qq --print-uris $missing | awk '{ print $2 }' | sort)
      echo "Missing packages:$missing"
      echo "Resolved to:"
      echo "$debs"
      echo "##vso[task.setvariable variable=UNO_APT_DEBS_KEY]$(echo "$debs" | sha256sum | cut -c1-16)"
    displayName: Resolve Linux dependencies

  # The cache lives in Azure Pipelines storage, not on an Ubuntu mirror, so a hit installs through a
  # mirror outage. On 2026-11-11 one took out every Linux and WebAssembly job for two hours.
  - task: Cache@2
    condition: and(succeeded(), ne(variables['UNO_APT_MISSING'], ''))
    continueOnError: true
    timeoutInMinutes: 5
    inputs:
      key: 'apt-debs | v1 | "$(Agent.OS)" | "$(UNO_APT_DEBS_KEY)"'
      path: $(Pipeline.Workspace)/.apt-debs
    displayName: Restore Linux dependency packages cache

  # apt has no bound of its own, so a stalling Ubuntu mirror escalates into a 60-minute job kill
  # that takes the whole test run with it. On 2026-08-19 that cost two jobs on PR #24121 and five
  # on master, each hanging ~59 minutes inside apt-get update having printed nothing. Every apt
  # invocation below is wrapped in `timeout`, and the budget fits under the task timeout so a job
  # that loses this step still has most of its 60 minutes left to actually run the tests.
  - bash: |
      set -uo pipefail

      missing="$(UNO_APT_MISSING)"
      if [ -z "${missing// }" ]; then
        exit 0
      fi

      # Downloads land in the cached folder, so a job that misses the cache fills it for the next one.
      cache="$(Pipeline.Workspace)/.apt-debs"
      mkdir -p "$cache/partial"
      # apt leaves root-owned lock and partial files that the agent cannot pack into the cache.
      trap 'sudo rm -rf "$cache/partial" "$cache/lock"; sudo chown -R "$(id -u):$(id -g)" "$cache"' EXIT

      apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::Languages=none -o Dpkg::Use-Pty=0 -o Dir::Cache::archives=$cache"

      if compgen -G "$cache/*.deb" > /dev/null; then
        if sudo timeout --kill-after=30s 1m apt-get install -y --no-download $apt_opts $missing; then
          echo "Installed from the packages cache without touching a mirror"
          exit 0
        fi
        echo "##vso[task.logissue type=warning]The packages cache did not cover$missing; downloading them"
        sudo dpkg --configure -a || true
      fi

      # The image ships pre-baked apt indexes. Installing straight from them skips the mirror
      # round-trip entirely, which is both the fast path and the one that cannot stall on a
      # refresh -- the observed hangs were all inside apt-get update.
      if sudo timeout --kill-after=30s 5m apt-get install -y $apt_opts $missing; then
        exit 0
      fi

      echo "##vso[task.logissue type=warning]Install from the pre-baked indexes failed; refreshing them from archive.ubuntu.com and retrying once"

      # A timeout-killed apt can leave dpkg half-configured, which would then break this install
      # and, in the WebAssembly job, the Chrome install that follows.
      sudo dpkg --configure -a || true

      # The hosted images read their mirror from this list, Azure's first. apt only moves down the list when a
      # connection fails, not when a download stalls, so retrying through Azure stalls again: put the main archive first.
      mirrors=/etc/apt/apt-mirrors.txt
      if [ -f "$mirrors" ]; then
        echo "Mirror list was: $(tr '\n\t' '; ' < "$mirrors")"
        printf '%s\tpriority:1\n%s\tpriority:2\n%s\tpriority:3\n' \
          https://archive.ubuntu.com/ubuntu/ http://azure.archive.ubuntu.com/ubuntu/ https://security.ubuntu.com/ubuntu/ \
          | sudo tee "$mirrors" > /dev/null
      fi

      if sudo timeout --kill-after=30s 3m apt-get update $apt_opts && sudo timeout --kill-after=30s 5m apt-get install -y $apt_opts $missing; then
        exit 0
      fi

      echo "##vso[task.logissue type=error]UNOBLD004: Could not install the Linux dependencies within the time budget from either Ubuntu mirror. This is an infrastructure failure, not a code failure."
      exit 1
    displayName: Install Linux dependencies
    # 1m + 5m + 3m + 5m = 14m of apt budget, with this as the hard backstop.
    timeoutInMinutes: 15
