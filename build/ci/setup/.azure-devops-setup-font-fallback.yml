parameters:
  vmImage: '$(linuxVMImage)'

stages:
- stage: FontFallback_Validation
  displayName: Setup - Font Fallback Maps Validation
  dependsOn: []

  jobs:
  - job: Validate_FontFallback
    displayName: Validate FontFallback.Maps.cs
    pool:
      vmImage: ${{ parameters.vmImage }}

    steps:
    - checkout: self
      clean: true

    - bash: |
        set -euo pipefail
        
        echo "Regenerating FontFallback.Maps.cs..."
        dotnet run --project src/FontFallbackPreprocessor -c Release -- --summary-only -o src/Uno.UI.Composition.Drawing/FontFallback.Maps.cs.new
        
        if ! diff -u -a src/Uno.UI.Composition.Drawing/FontFallback.Maps.cs src/Uno.UI.Composition.Drawing/FontFallback.Maps.cs.new > diff.txt; then
          echo "Error: FontFallback.Maps.cs is not up to date."
          cat diff.txt
          echo "Please run the following command locally and commit the changes:"
          echo "dotnet run --project src/FontFallbackPreprocessor -- --summary-only -o src/Uno.UI.Composition.Drawing/FontFallback.Maps.cs"
          exit 1
        else
          echo "FontFallback.Maps.cs is up to date."
          rm src/Uno.UI.Composition.Drawing/FontFallback.Maps.cs.new
          rm -f diff.txt
        fi
      displayName: Validate FontFallback.Maps.cs
