steps:
- task: PowerShell@2
  displayName: Validate packages.json (NuGet existence check)
  inputs:
    pwsh: true
    filePath: build/ci/scripts/validate-packages-json.ps1
    arguments: '-PackagesJsonPath "$(Build.SourcesDirectory)/src/Uno.Sdk/packages.json"'
  env:
    BUILD_SOURCEBRANCH: $(Build.SourceBranch)
    SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)

- task: PowerShell@2
  displayName: Validate package version alignment (nuspecs, Uno.Sdk.Private, SkiaSharp)
  inputs:
    pwsh: true
    filePath: build/ci/scripts/validate-package-version-alignment.ps1
    arguments: '-RepoRoot "$(Build.SourcesDirectory)"'
