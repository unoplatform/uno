stages:
# TEMP (do not merge): only Setup + WinAppSDK tests, to catch the intermittent WinUI runtime tests app crash.
- stage: Setup
  displayName: Setup
  jobs:
  - job: Validations
    cancelTimeoutInMinutes: 0
  
    pool:
      vmImage: $(linuxVMImage)

    steps:
    - checkout: self
      clean: true
      persistCredentials: true
      sparseCheckoutPatterns: |
        # root files are needed for versioning and build scripts
        /*
        doc/**
        README.md
        README/**
        build/**
        src/Directory.Packages.props
        src/Uno.Sdk/packages.json

    - template: templates/gitversion-run.yml
    - template: setup/.azure-devops-setup-commitsar.yml
    - template: setup/.azure-devops-setup-validate-packages.yml
    - template: setup/.azure-devops-setup-doc-validations.yml

  - job: DetermineScope
    cancelTimeoutInMinutes: 0
    displayName: Determine Test Scope

    pool:
      vmImage: $(linuxVMImage)

    steps:
    - checkout: self
      clean: false
      persistCredentials: true
      fetchDepth: 0

    - task: PowerShell@2
      name: SetScope
      displayName: Evaluate template/screenshot-impacting changes
      inputs:
        pwsh: true
        filePath: build/ci/scripts/determine-test-scope.ps1

- stage: wasdk_tests
  displayName: Tests - WinAppSDK
  dependsOn:
    - Setup

  jobs:
  - template: tests/.azure-devops-tests-winappsdk.yml
    parameters:
      poolName: '$(windowsScaledPool)'

