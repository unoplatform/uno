parameters:
  vmLinuxImage: ''
  XAML_FLAVOR_BUILD: ''

jobs:
- job: Skia_Tests_Build_Browser
  displayName: 'Build Samples App'
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 0

  pool:
    vmImage: ${{ parameters.vmLinuxImage }}

  variables:
    CombinedConfiguration: Release|Any CPU
    CI_Build: true

    # Use pre-defined local nuget cache for restore
    NUGET_PACKAGES: $(Agent.WorkFolder)/.nuget

    XAML_FLAVOR_BUILD: ${{ parameters.XAML_FLAVOR_BUILD }}

    # Disable analyzers for eligible projects in samples to improve performance

  steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - template: ../templates/gitversion.yml
  - template: ../templates/dotnet-mobile-install-windows.yml
    parameters:
      UnoCheckParameters: '--preview-major --tfm $(netCurrentTargetFramework)-browserwasm'

 
  - template: ../templates/nuget-cache.yml
    parameters:
      nugetPackages: $(NUGET_PACKAGES)

  - powershell: |
      dotnet publish src/SamplesApp/SamplesApp/SamplesApp.csproj -c Release -f $(netCurrentTargetFramework)-browserwasm -p:UnoTargetFrameworkOverride=$(netCurrentTargetFramework)-browserwasm -p:PreBuildUnoUITasks=true -p:UNO_DISABLE_ANALYZERS_IN_SAMPLES=true /bl:$(build.artifactstagingdirectory)/logs/build-skia-wasm-browser.binlog
    displayName: Build Wasm Skia Head

  - pwsh: |
      # The published wwwroot is mounted at two different roots: the runtime-test job serves it at
      # localhost:8000/ (wasm-run-skia-runtime-tests.sh) and PR staging serves it from
      # /pr-<N>/wasm-skia-net9/. It must therefore stay relocatable.
      $wwwroot = "$(Build.SourcesDirectory)/src/SamplesApp/SamplesApp/bin/Release/$(netCurrentTargetFramework)-browserwasm/publish/wwwroot"
      $files = @(Get-ChildItem -Path $wwwroot -Recurse -File -Include 'index.html','uno-config.js')
      if ($files.Count -eq 0) {
        Write-Host "##vso[task.logissue type=error]No index.html/uno-config.js found under $wwwroot - the publish layout changed."
        exit 1
      }
      $bad = @($files | Where-Object { (Get-Content -Raw $_.FullName) -match '"/package_' })
      if ($bad.Count -gt 0) {
        foreach ($f in $bad) {
          $path = $f.FullName
          Write-Host "##vso[task.logissue type=error]$path references assets with an absolute /package_ path, which 404s under the sub-folder PR staging deployment. Set WasmShellWebAppBasePath to ./ in src/SamplesApp/SamplesApp/SamplesApp.csproj."
        }
        exit 1
      }
      $count = $files.Count
      Write-Host "Base path check passed: $count file(s), no absolute /package_ references."
    displayName: 'Verify wasm assets are sub-folder relocatable'

  - pwsh: |
      $artifactName = "samplesapp-wasm-skia"
      if ([int]$env:SYSTEM_JOBATTEMPT -gt 1) { $artifactName += "-attempt$env:SYSTEM_JOBATTEMPT" }
      Write-Host "Publishing Samples App artifact: $artifactName"
      Write-Host "##vso[task.setvariable variable=SamplesAppArtifactName]$artifactName"
      Write-Host "##vso[task.setvariable variable=SamplesAppArtifactName;isOutput=true]$artifactName"
    name: set_samples_artifact
    displayName: 'Set Samples App Artifact Name'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish WebAssembly Binaries'
    retryCountOnTaskFailure: 3
    inputs:
      targetPath: $(Build.SourcesDirectory)/src/SamplesApp/SamplesApp/bin/Release/$(netCurrentTargetFramework)-browserwasm/publish/wwwroot
      artifactName: $(SamplesAppArtifactName)

  - task: PublishBuildArtifacts@1
    retryCountOnTaskFailure: 3
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)/logs
      ArtifactName: samplesapp-wasm-skia-logs
      ArtifactType: Container
