parameters:
  vmLinuxImage: ''
  XAML_FLAVOR_BUILD: ''
  jobName: 'Skia_Tests_Build_Browser'
  displayName: 'Build Samples App'
  # The TFM to publish; the previous one also needs its wasm-tools workload (installPreviousWasmTools).
  targetFramework: '$(netCurrentTargetFramework)'
  installPreviousWasmTools: false
  artifactName: 'samplesapp-wasm-skia'
  # Extra MSBuild arguments for the publish, e.g. '-p:WasmEnableThreads=true'.
  publishArguments: ''

jobs:
- job: ${{ parameters.jobName }}
  displayName: '${{ parameters.displayName }}'
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 0

  pool:
    vmImage: ${{ parameters.vmLinuxImage }}

  variables:
    CombinedConfiguration: Release|Any CPU
    CI_Build: true

    # Use pre-defined local nuget cache for restore
    NUGET_PACKAGES: $(Agent.WorkFolder)/.nuget

    XAML_FLAVOR_BUILD: ${{ parameters.XAML_FLAVOR_BUILD }}

    # Disable analyzers for eligible projects in samples to improve performance

  steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - template: ../templates/gitversion.yml
  - template: ../templates/host-cleanup-linux.yml
  - template: ../templates/dotnet-mobile-install-windows.yml
    parameters:
      UnoCheckParameters: '--preview-major --tfm $(netCurrentTargetFramework)-browserwasm'

  - ${{ if eq(parameters.installPreviousWasmTools, true) }}:
    - template: ../templates/dotnet-install-previous-wasmtools.yml

  - template: ../templates/nuget-cache.yml
    parameters:
      nugetPackages: $(NUGET_PACKAGES)

  - powershell: |
      dotnet publish src/SamplesApp/SamplesApp/SamplesApp.csproj -c Release -f ${{ parameters.targetFramework }}-browserwasm -p:UnoTargetFrameworkOverride=${{ parameters.targetFramework }}-browserwasm -p:PreBuildUnoUITasks=true -p:UNO_DISABLE_ANALYZERS_IN_SAMPLES=true ${{ parameters.publishArguments }} /bl:$(build.artifactstagingdirectory)/logs/build-skia-wasm-browser.binlog
    displayName: Build Wasm Skia Head

  - pwsh: |
      $artifactName = "${{ parameters.artifactName }}"
      if ([int]$env:SYSTEM_JOBATTEMPT -gt 1) { $artifactName += "-attempt$env:SYSTEM_JOBATTEMPT" }
      Write-Host "Publishing Samples App artifact: $artifactName"
      Write-Host "##vso[task.setvariable variable=SamplesAppArtifactName]$artifactName"
      Write-Host "##vso[task.setvariable variable=SamplesAppArtifactName;isOutput=true]$artifactName"
    name: set_samples_artifact
    displayName: 'Set Samples App Artifact Name'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish WebAssembly Binaries'
    retryCountOnTaskFailure: 3
    inputs:
      targetPath: $(Build.SourcesDirectory)/src/SamplesApp/SamplesApp/bin/Release/${{ parameters.targetFramework }}-browserwasm/publish/wwwroot
      artifactName: $(SamplesAppArtifactName)

  - task: PublishBuildArtifacts@1
    retryCountOnTaskFailure: 3
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)/logs
      ArtifactName: ${{ parameters.artifactName }}-logs
      ArtifactType: Container
