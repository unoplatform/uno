parameters:
  vmImage: ''
  vmMacImage: ''
  vmLinuxImage: ''
  vmLinuxPool: ''
  xCodeRootBuild: ''
  poolName: ''
  XAML_FLAVOR_BUILD: ''
  jobName: 'Skia_macos_Runtime_Tests_Build'
  testResultLabel: ''
  # 'WebGPU' runs the app on the WebGPU backend (Metal).
  renderer: 'Skia'

jobs:

- job: ${{ parameters.jobName }}
  displayName: '${{ parameters.renderer }} Runtime Tests'
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 0
  ${{ if eq(parameters.renderer, 'WebGPU') }}:
    # On pull requests only when they touch WebGPU or the test infrastructure (determine-test-scope.ps1); master runs it always.
    condition: and(succeeded(), or(ne(variables['Build.Reason'], 'PullRequest'), eq(stageDependencies.Setup.outputs['DetermineScope.SetScope.WebGpuTestsRequired'], 'true')))

  pool:
    vmImage: ${{ parameters.vmMacImage }}

  variables:
    SamplesAppArtifactName: samplesapp-desktop-skia
    SamplesAppArtifactPath: $(build.sourcesdirectory)/build/$(SamplesAppArtifactName)

    XAML_FLAVOR_BUILD: ${{ parameters.XAML_FLAVOR_BUILD }}

  steps:

  - task: DownloadPipelineArtifact@2
    displayName: Downloading $(SamplesAppArtifactName)
    inputs:
      artifact: $(SamplesAppArtifactName)
      path: $(build.sourcesdirectory)/build/$(SamplesAppArtifactName)

  - task: DownloadPipelineArtifact@2
    condition: gt(variables['System.JobAttempt'], 1)
    continueOnError: true
    displayName: Download previous test runs failed tests
    inputs:
      artifact: runtime-tests-desktop-skia-macos${{ parameters.testResultLabel }}-failures
      path: '$(build.sourcesdirectory)/build/uitests-failure-results'

  - template: ../templates/dotnet-install.yml

  - script: |
      # Build source generators for hot reload runtime tests
      # Used to build the hot reload test secondary app during runtime tests
      cd $(build.sourcesdirectory)/src/SourceGenerators/Uno.UI.Tasks
      dotnet build -c Debug
      cd $(build.sourcesdirectory)/src/SourceGenerators/Uno.UI.SourceGenerators
      dotnet build -c Debug
      cd $(build.sourcesdirectory)/src/Uno.UI.RemoteControl.Host
      dotnet build -c Debug
    displayName: Build HR dependencies

  - script: |
      chmod +x build/test-scripts/macos-skia-runtime-tests.sh
      build/test-scripts/macos-skia-runtime-tests.sh
    displayName: Run macOS ${{ parameters.renderer }} Runtime Tests
    env:
      SamplesAppArtifactPath: $(SamplesAppArtifactPath)
      SamplesAppArtifactName: $(SamplesAppArtifactName)
      UNO_TEST_RESULT_LABEL: ${{ parameters.testResultLabel }}
      ${{ if eq(parameters.renderer, 'WebGPU') }}:
        UNO_WEBGPU: 1
        UNO_WEBGPU_LOG: warn

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testRunTitle: 'macOS ${{ parameters.renderer }} Runtime Tests'
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(build.sourcesdirectory)/build/skia-macos${{ parameters.testResultLabel }}-runtime-tests-results.xml'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishBuildArtifacts@1
    condition: always()
    displayName: Publish Failed Tests Results
    retryCountOnTaskFailure: 3
    inputs:
      PathtoPublish: $(build.sourcesdirectory)/build/uitests-failure-results
      ArtifactName: runtime-tests-desktop-skia-macos${{ parameters.testResultLabel }}-failures
      ArtifactType: Container
