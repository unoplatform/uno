parameters:
  vmImage: ''
  vmMacImage: ''
  vmLinuxImage: ''
  vmLinuxPool: ''
  xCodeRootBuild: ''
  poolName: ''
  XAML_FLAVOR_BUILD: ''

stages:
- stage: runtime_tests_skia_build
  displayName: Build - Desktop Runtime Tests
  dependsOn:
    - binaries_build_native_macos

  jobs:
  - template: .azure-devops-tests-desktop-build.yml
    parameters:
      vmImage: '${{ parameters.vmImage }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'

- stage: runtime_tests_skia_browser
  displayName: Tests - WebAssembly
  dependsOn:
    - Setup

  jobs:
  - template: .azure-devops-tests-webassembly-build.yml
    parameters:
      vmLinuxImage: '${{ parameters.vmLinuxImage }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'

  - template: .azure-devops-tests-webassembly.yml
    parameters:
      vmLinuxImage: '${{ parameters.vmLinuxImage }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'
  # The same app on the WebGPU backend, on hosted macOS: its agents expose a paravirtual Metal GPU, which Chrome's
  # WebGPU uses. The Linux agents have none, and Chrome's SwiftShader fallback ran at 2-4 frames per second.
  - template: .azure-devops-tests-webassembly.yml
    parameters:
      os: 'macOS'
      vmMacImage: '${{ parameters.vmMacImage }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'
      jobName: 'Skia_Browser_WebGpu_Runtime_Tests'
      renderer: 'WebGPU'
      testResultLabel: '-webgpu'
      appEnvironment: 'UNO_WEBGPU=1'
      chromeFlags: '--enable-unsafe-webgpu --user-data-dir=/tmp/uno-chrome-webgpu-profile'
      testGroups: [0, 1, 2, 3]
      browserSize: '1280x800'
      # Groups split by test method, so the leak tests' When_Add_Remove (~21 min of data rows) always lands whole in one.
      resultsTimeoutMinutes: 55
      jobTimeoutInMinutes: 75
      # On pull requests only when they touch WebGPU or the test infrastructure (determine-test-scope.ps1).
      condition: "and(succeeded(), or(ne(variables['Build.Reason'], 'PullRequest'), eq(stageDependencies.Setup.DetermineScope.outputs['SetScope.WebGpuTestsRequired'], 'true')))"

- stage: runtime_tests_skia_android
  displayName: Tests - Android
  dependsOn:
    - Setup

  jobs:
  - template: .azure-devops-tests-android-build.yml
    parameters:
      vmLinuxPool: '${{ parameters.vmLinuxPool }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'
  - template: .azure-devops-tests-android.yml
    parameters:
      vmLinuxPool: '${{ parameters.vmLinuxPool }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'

  # The same APK on the WebGPU backend, on the emulator's software Vulkan (SwiftShader).
  - template: .azure-devops-tests-android.yml
    parameters:
      vmLinuxPool: '${{ parameters.vmLinuxPool }}'
      XAML_FLAVOR_BUILD: '${{ parameters.XAML_FLAVOR_BUILD }}'
      jobName: 'Android_WebGpu_Tests'
      renderer: 'WebGPU'
      testResultLabel: '-webgpu'
      appExtras: '-e UNO_WEBGPU 1 -e UNO_WEBGPU_LOG warn'
      # On pull requests only when they touch WebGPU or the test infrastructure (determine-test-scope.ps1).
      condition: "and(succeeded(), or(ne(variables['Build.Reason'], 'PullRequest'), eq(stageDependencies.Setup.DetermineScope.outputs['SetScope.WebGpuTestsRequired'], 'true')))"

- stage: runtime_tests_skia_android_nativeaot
  displayName: Tests - Android+NativeAOT
  dependsOn:
    - Setup

  jobs:
