parameters:
  vmImage: ''
  xCodeRoot: ''
  JobName: ''
  TestRunName: ''
  JobTimeoutInMinutes: ''
  JobDisplayName: ''
  UITEST_ALLOW_RERUN: ''
  UITEST_VARIANT: ''
  UITEST_TEST_TIMEOUT: ''
  UITEST_RUNTIME_TEST_GROUP: ''
  UITEST_RUNTIME_TEST_GROUP_COUNT: ''
  TEST_KIND: ''   # 'runtime'
  SAMPLESAPP_BUNDLE_ID: ''
  nugetPackages: ''
  dependsOn: ''
  SamplesAppArtifactName: ''
  BuildJobName: ''

jobs:
- job: ${{ parameters.JobName }}
  timeoutInMinutes: ${{ parameters.JobTimeoutInMinutes }}
  cancelTimeoutInMinutes: 0
  dependsOn: ${{ parameters.dependsOn }}
  displayName: ${{ parameters.JobDisplayName }}
  pool:
    vmImage: ${{ parameters.vmImage }}

  variables:
  - name: CI_Build
    value: true
  - name: SourceLinkEnabled
    value: false
  - name: NUGET_PACKAGES
    value: $(Pipeline.Workspace)/.nuget/packages
  - name: UITEST_ALLOW_RERUN
    value: ${{ parameters.UITEST_ALLOW_RERUN }}
  - name: SamplesAppArtifactName
    value: ${{ parameters.SamplesAppArtifactName }}
  - ${{ if and(eq(parameters.SamplesAppArtifactName, ''), ne(parameters.BuildJobName, '')) }}:
    - name: SamplesAppArtifactName
      value: $[ dependencies.${{ parameters.BuildJobName }}.outputs['set_tvos_artifact.SamplesAppArtifactName'] ]

  steps:
  - checkout: self
    clean: true

  - task: DownloadPipelineArtifact@2
    displayName: Downloading tvOS Samples App
    inputs:
      artifact: $(SamplesAppArtifactName)
      path: $(build.sourcesdirectory)/build/$(SamplesAppArtifactName)

  - task: DownloadPipelineArtifact@2
    condition: gt(variables['System.JobAttempt'], 1)
    continueOnError: true
    displayName: Download previous test runs failed tests
    inputs:
      artifact: ${{ parameters.TEST_KIND }}-tests-tvos-${{ parameters.UITEST_VARIANT }}-failures
      path: '$(build.sourcesdirectory)/build/uitests-failure-results'

  - template: ../templates/dotnet-install.yml

  - template: ../templates/nuget-cache.yml
    parameters:
      nugetPackages: $(NUGET_PACKAGES)

  - template: ../templates/ios-build-select-version.yml
    parameters:
      xCodeRoot: ${{ parameters.xCodeRoot }}
      platform: 'tvOS'
      simulatorSdk: 'appletvsimulator'

  - bash: |
      rm -f ${HOME}/Library/Preferences/Xamarin/Settings.plist
    # https://github.com/actions/virtual-environments/issues/1932
    displayName: Apply workaround for Azure Devops issue 1932

  - task: PowerShell@2
    displayName: 'Fill Rerun Variable'
    inputs:
      ## Expression evaluation for task parameters is not supported
      ## Invert UITEST_ALLOW_RERUN in a task
      targetType: inline
      script: |
        Set-PSDebug -Trace 1
        if( "${{ parameters.UITEST_ALLOW_RERUN }}" -eq "false") {
          $val = "true"
        } else {
          $val = "false"
        }
        echo "##vso[task.setvariable variable=FAIL_TESTS_ON_NO_RERUN]$val"

  - bash: |
      TFM="$(netCurrentTargetFramework)-tvos" $(build.sourcesdirectory)/build/test-scripts/tvos-uitest-run.sh

    displayName: Run tvOS Simulator Tests

    env:
      BUILD_SOURCESDIRECTORY: "$(build.sourcesdirectory)"
      BUILD_ARTIFACTSTAGINGDIRECTORY: "$(build.artifactstagingdirectory)"
      UITEST_RUNTIME_TEST_GROUP: "${{ parameters.UITEST_RUNTIME_TEST_GROUP }}"
      UITEST_RUNTIME_TEST_GROUP_COUNT: "${{ parameters.UITEST_RUNTIME_TEST_GROUP_COUNT }}"
      UITEST_TEST_TIMEOUT: "${{ parameters.UITEST_TEST_TIMEOUT }}"
      UITEST_VARIANT: "${{ parameters.UITEST_VARIANT }}"
      UNO_UITEST_TVOSBUNDLE_PATH: "$(build.sourcesdirectory)/build/$(SamplesAppArtifactName)/SamplesApp.app"
      SAMPLESAPP_BUNDLE_ID: "${{ parameters.SAMPLESAPP_BUNDLE_ID }}"

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testRunTitle: ${{ parameters.TestRunName }}
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(build.sourcesdirectory)/build/TestResult-original.xml'

      # don't fail on failed tests when a second run is allowed, it will do it
      # see https://github.com/unoplatform/uno/issues/6714
      failTaskOnFailedTests: $(FAIL_TESTS_ON_NO_RERUN)

  ## Second run: only reachable when the harness died before any test started -- a boot or
  ## install failure is worth one more attempt, unlike a genuine test failure, which would not
  ## fit the job budget a second time.
  - bash: |
      TFM="$(netCurrentTargetFramework)-tvos" $(build.sourcesdirectory)/build/test-scripts/tvos-uitest-run.sh

    displayName: Run tvOS Simulator Tests (re-run)
    condition: or(eq(variables.UITEST_ALLOW_RERUN, 'true'), eq(variables.UNO_TVOS_HARNESS_CRASHED, 'true'))

    env:
      BUILD_SOURCESDIRECTORY: "$(build.sourcesdirectory)"
      BUILD_ARTIFACTSTAGINGDIRECTORY: "$(build.artifactstagingdirectory)"
      UITEST_RUNTIME_TEST_GROUP: "${{ parameters.UITEST_RUNTIME_TEST_GROUP }}"
      UITEST_RUNTIME_TEST_GROUP_COUNT: "${{ parameters.UITEST_RUNTIME_TEST_GROUP_COUNT }}"
      UITEST_TEST_TIMEOUT: "${{ parameters.UITEST_TEST_TIMEOUT }}"
      UITEST_VARIANT: "${{ parameters.UITEST_VARIANT }}"
      UNO_UITEST_TVOSBUNDLE_PATH: "$(build.sourcesdirectory)/build/$(SamplesAppArtifactName)/SamplesApp.app"
      SAMPLESAPP_BUNDLE_ID: "${{ parameters.SAMPLESAPP_BUNDLE_ID }}"

  - task: PublishTestResults@2
    condition: or(eq(variables.UITEST_ALLOW_RERUN, 'true'), eq(variables.UNO_TVOS_HARNESS_CRASHED, 'true'))
    inputs:
      testRunTitle: ${{ parameters.TestRunName }}
      testResultsFormat: 'NUnit'
      testResultsFiles: '$(build.sourcesdirectory)/build/TestResult-original.xml'
      # Second run needs to fail tests
      # see https://github.com/unoplatform/uno/issues/6714
      failTaskOnFailedTests: true

  - task: PublishBuildArtifacts@1
    condition: always()
    retryCountOnTaskFailure: 10
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: ${{ parameters.TEST_KIND }}-tests-tvos-${{ parameters.UITEST_VARIANT }}-results
      ArtifactType: Container

  # logs files are large, so we create them outside of `artifactstagingdirectory` and publish
  # them in a separate artifacts container.
  - task: PublishBuildArtifacts@1
    condition: always()
    retryCountOnTaskFailure: 10
    inputs:
      PathtoPublish: $(build.sourcesdirectory)/tvos-ui-tests-logs
      ArtifactName: ${{ parameters.TEST_KIND }}-tests-tvos-${{ parameters.UITEST_VARIANT }}-logs
      ArtifactType: Container

  - task: PublishBuildArtifacts@1
    displayName: Publish Failed Tests Results List
    condition: always()
    retryCountOnTaskFailure: 3
    inputs:
      PathtoPublish: $(build.sourcesdirectory)/build/uitests-failure-results
      ArtifactName: ${{ parameters.TEST_KIND }}-tests-tvos-${{ parameters.UITEST_VARIANT }}-failures
      ArtifactType: Container
