name: Sync master into feature and release branches

# Keeps long-lived `feature/*` integration branches current with `master`, and
# feeds `release/stable/X.Y` branches (see "Release branches" below).
#
# Per active feature branch it maintains ONE pull request whose merge brings the
# latest master in:
#   - Builds a disposable `automation/master-sync/<feature>` branch by *raw git
#     merge* of master into the feature branch (NOT peter-evans — we must keep
#     master in the merge ancestry, or every night re-merges all of master).
#   - Clean merge  -> ready PR + auto-merge (merge-commit method, ancestry-preserving).
#   - Conflicts    -> commits the conflict markers, opens the PR as a DRAFT so a
#     half-merge can never auto-land, labels it and pings the team once.
#   - Already current / nothing new -> closes the PR and deletes the branch.
#   - A human's pushed resolution on the sync branch is never clobbered: when the
#     sync branch carries non-bot commits, the next run re-merges master *on top*
#     of their work instead of resetting to the feature tip.
#
# "Active" = a `feature/*` branch with a commit within ACTIVITY_DAYS (default 30).
#
# Release branches go through two phases:
#
# 1. Stabilization: right after branching, STABILIZATION_BRANCH receives ALL of
#    master by the same merge sync, every run. STABILIZATION_EXCLUDED_PRS lists
#    master PRs it must never receive (e.g. the post-branching version bump). Each
#    is recorded as merged with `git merge -s ours` right after merging its parent,
#    so ancestry stays intact and later syncs only bring in what came after it.
#    This needs a merge-commit or squash merged PR; for a rebase-merged one only
#    its last commit would be skipped.
#
# 2. Service: once the release is stable, clear STABILIZATION_BRANCH. From then on
#    only master PRs labeled `backport-X.Y` reach `release/stable/X.Y`. Every run
#    cherry-picks (`-x`) the labeled PRs it has not received yet, in merge order,
#    onto ONE `automation/backport/release/stable/X.Y` branch and PR. It also runs
#    as soon as such a PR merges, or a merged PR gets the label. The label
#    may be added before or after the PR merges. A PR is already received when its
#    merge commit is in the release branch, a release commit was cherry-picked
#    from it, or a release commit's message says `(backport #N)` (manual and
#    Mergify backports). A PR that does not cherry-pick cleanly is left out and listed in
#    the backport PR, and its author is pinged once to backport it by hand. Remove
#    the label to stop retrying. A rebase-merged PR only brings its last commit.
#
# Token: falls back to the default GITHUB_TOKEN, but that is NOT sufficient in
# general. A sync merge that updates `.github/workflows/**` cannot be pushed by
# GITHUB_TOKEN at all — GitHub rejects it with "refusing to allow a GitHub App to
# create or update workflow ... without `workflows` permission", and `workflows`
# is not a grantable `permissions:` key, so no job-level setting can unblock it.
# Once master and a feature branch have both touched a workflow file, EVERY sync
# of that branch is blocked until a `SYNC_BOT_TOKEN` secret exists.
#
# Provide `SYNC_BOT_TOKEN` as a PAT with `workflow` scope (fine-grained: Contents
# + Pull requests + Workflows, all read/write) or a GitHub App token with the
# equivalent. It takes over with zero edits, and additionally fixes (a) any
# *required* check that is itself a GitHub Actions workflow (those are suppressed
# under the default token) and (b) team-reviewer requests (the repo-scoped default
# token cannot read org team membership).
#
# The gating CI is Azure Pipelines, whose GitHub App receives PR webhooks
# regardless of the pusher, so CI still runs and auto-merge still completes either way.
#
# Repo prerequisite: Settings -> General -> "Allow auto-merge" must be ON, and
# `feature/*` must have its required-review + required-CI protection. The
# enumerate job warns loudly if auto-merge is disabled.

on:
  schedule:
    - cron: '0 4 * * *' # nightly 04:00 UTC
  # Backports right away when a labeled PR merges or a merged PR gets labeled.
  # Safe as pull_request_target: no job checks out or runs the PR's code.
  pull_request_target:
    types: [closed, labeled]
    branches: [master]
  workflow_dispatch:
    inputs:
      activity_days:
        description: 'Only sync feature/* branches with a commit within this many days'
        required: false
        default: '30'
      dry_run:
        description: 'Compute and log target branches but make no changes'
        type: boolean
        required: false
        default: false

env:
  # Release in the stabilization phase (receives all of master), or '' when none.
  # Every other release/stable/X.Y only receives PRs labeled backport-X.Y.
  STABILIZATION_BRANCH: ''
  # Comma-separated master PR numbers kept out of STABILIZATION_BRANCH.
  STABILIZATION_EXCLUDED_PRS: ''

# Permissions are set per-job below (least privilege): enumerate only reads,
# sync needs write to push branches and manage PRs. Concurrency is per target
# branch (on the jobs), so a run queued for one release never displaces another's.

jobs:
  enumerate:
    name: Find sync targets
    # PR events only matter for a merged PR carrying a backport-X.Y label.
    if: >-
      github.repository == 'unoplatform/uno'
      && (github.event_name != 'pull_request_target'
          || (github.event.pull_request.merged
              && ((github.event.action == 'closed' && contains(join(github.event.pull_request.labels.*.name, ' '), 'backport-'))
                  || (github.event.action == 'labeled' && startsWith(github.event.label.name, 'backport-')))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Listing the backport-X.Y labels.
      issues: read
    outputs:
      branches: ${{ steps.list.outputs.branches }}
      count: ${{ steps.list.outputs.count }}
      releases: ${{ steps.releases.outputs.releases }}
      release_count: ${{ steps.releases.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Preflight — verify auto-merge is allowed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allowed="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge' 2>/dev/null || echo unknown)"
          if [ "$allowed" != "true" ]; then
            echo "::warning::Repository 'Allow auto-merge' is '${allowed}'. Sync PRs will be created but cannot auto-merge until it is enabled (Settings → General → Allow auto-merge)."
            echo "> ⚠️ **Allow auto-merge is not enabled** — sync PRs will need manual merge." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enumerate active feature/* branches
        id: list
        shell: bash
        env:
          ACTIVITY_DAYS: ${{ github.event.inputs.activity_days || '30' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "branches=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin '+refs/heads/feature/*:refs/remotes/origin/feature/*' --prune
          now=$(date +%s)
          cutoff=$(( now - ACTIVITY_DAYS * 86400 ))
          json='[]'
          while IFS=$'\t' read -r ts ref; do
            [ -z "${ref:-}" ] && continue
            if [ "$ts" -ge "$cutoff" ]; then
              name="${ref#origin/}"
              json=$(jq -cn --argjson cur "$json" --arg b "$name" '$cur + [$b]')
            fi
          done < <(git for-each-ref --sort=-committerdate \
                     --format='%(committerdate:unix)%09%(refname:short)' \
                     'refs/remotes/origin/feature/*')
          features="$(jq 'length' <<<"$json")"

          stab=""
          if [ -n "$STABILIZATION_BRANCH" ]; then
            if git ls-remote --exit-code --heads origin "$STABILIZATION_BRANCH" >/dev/null 2>&1; then
              json=$(jq -cn --argjson cur "$json" --arg b "$STABILIZATION_BRANCH" '$cur + [$b]')
              stab="Release stabilization: \`${STABILIZATION_BRANCH}\` (excluding PRs: ${STABILIZATION_EXCLUDED_PRS:-none})"
            else
              echo "::warning::STABILIZATION_BRANCH '${STABILIZATION_BRANCH}' does not exist; clear it in master-sync.yml."
              stab="> ⚠️ STABILIZATION_BRANCH \`${STABILIZATION_BRANCH}\` does not exist."
            fi
          fi

          echo "branches=$json" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$json")" >> "$GITHUB_OUTPUT"
          {
            echo "### Active \`feature/*\` branches (≤ ${ACTIVITY_DAYS}d)"
            if [ "$features" -eq 0 ]; then
              echo "_None._"
            else
              jq -r '.[:'"$features"'][] | "- `\(.)`"' <<<"$json"
            fi
            if [ -n "$stab" ]; then
              echo ""
              echo "$stab"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enumerate release branches in service
        id: releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # A PR event only backports to the releases that PR is labeled for.
          if [ "$EVENT_NAME" != "pull_request_target" ]; then
            labels="$(gh label list --search 'backport-' --limit 200 --json name --jq '.[].name')"
          elif [ "$EVENT_ACTION" = "labeled" ]; then
            labels="$ADDED_LABEL"
          else
            labels="$(jq -r '.[]' <<<"$PR_LABELS")"
          fi
          json='[]'
          while read -r label; do
            [[ "$label" =~ ^backport-([0-9]+\.[0-9]+)$ ]] || continue
            branch="release/stable/${BASH_REMATCH[1]}"
            # Its stabilization merge sync already brings in everything.
            [ "$branch" = "$STABILIZATION_BRANCH" ] && continue
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              json=$(jq -cn --argjson cur "$json" --arg b "$branch" --arg l "$label" '$cur + [{branch: $b, label: $l}]')
            else
              echo "::warning::Label '${label}' has no '${branch}' branch to backport to."
            fi
          done <<<"$labels"
          echo "releases=$json" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$json")" >> "$GITHUB_OUTPUT"
          {
            echo "### Release branches in service (label-driven backports)"
            if [ "$(jq 'length' <<<"$json")" -eq 0 ]; then
              echo "_None._"
            else
              jq -r '.[] | "- `\(.label)` → `\(.branch)`"' <<<"$json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: 'Sync: ${{ matrix.branch }}'
    needs: enumerate
    if: needs.enumerate.outputs.count != '0'
    runs-on: ubuntu-latest
    concurrency:
      group: master-sync-${{ matrix.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # Labels are an Issues API operation: creating 'sync-failed' needs this.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.enumerate.outputs.branches) }}
    env:
      # Swap-seam: SYNC_BOT_TOKEN (PAT/App) wins if present, else the default token.
      SYNC_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}
      # Secrets cannot be tested from bash, so surface presence as a plain boolean.
      HAS_SYNC_BOT_TOKEN: ${{ secrets.SYNC_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Sync master into ${{ matrix.branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          FEATURE: ${{ matrix.branch }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REVIEW_TEAM: unoplatform/uno-core-team
          BOT_NAME: 'github-actions[bot]'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          SYNC_BRANCH="automation/master-sync/${FEATURE}"
          TITLE="chore(automation): Sync master → ${FEATURE}"
          CMARKER="<!-- master-sync-bot:conflict -->"
          PMARKER="<!-- master-sync-bot:push-failed -->"
          # Trailer on every bot commit that contains conflict markers.
          CONFLICT_TRAILER="Master-Sync-Conflict: unresolved"

          # Guarantee exactly ONE summary row per matrix leg, however we exit.
          STATUS=""
          note() { STATUS="$1"; }
          trap '{ echo "### \`${FEATURE}\`"; echo "${STATUS:-❌ errored — see logs}"; } >> "$GITHUB_STEP_SUMMARY"' EXIT

          git config user.name "$BOT_NAME"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin master "${FEATURE}" --prune
          git fetch origin "${SYNC_BRANCH}" >/dev/null 2>&1 || true

          # gh pr lookup that never aborts the step (set -e safe).
          open_pr() { gh pr list --head "$SYNC_BRANCH" --base "$FEATURE" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true; }

          # --- 1. Already current: feature already contains master -> nothing to do. ---
          if git merge-base --is-ancestor "origin/master" "origin/${FEATURE}"; then
            pr="$(open_pr)"
            if [ -n "$pr" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                note "already current — would close stale PR #$pr (dry-run)"
              else
                gh pr close "$pr" --comment "\`${FEATURE}\` is already up to date with \`master\`; closing this sync PR." --delete-branch || true
                note "already current — closed stale PR #$pr"
              fi
            else
              note "already current — nothing to do"
            fi
            exit 0
          fi

          incoming="$(git rev-list --count "origin/${FEATURE}..origin/master")" || { note "❌ rev-list failed"; exit 1; }
          range="$(git rev-parse --short "origin/${FEATURE}")..$(git rev-parse --short origin/master)" || { note "❌ rev-parse failed"; exit 1; }

          # Stabilization only: excluded master PRs, resolved to their merge commits and
          # kept while still pending (on master, not yet in the target).
          EXCLUDED_SHAS=()
          excluded_list=""
          excluded_prs=""
          if [ -n "$STABILIZATION_BRANCH" ] && [ "$FEATURE" = "$STABILIZATION_BRANCH" ]; then
            excluded_prs="$STABILIZATION_EXCLUDED_PRS"
          fi
          for n in ${excluded_prs//,/ }; do
            sha="$(gh pr view "$n" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)"
            if [ -z "$sha" ] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              note "❌ excluded PR #$n has no reachable merge commit"
              exit 1
            fi
            excluded_list="${excluded_list} #${n}"
            if git merge-base --is-ancestor "$sha" origin/master \
               && ! git merge-base --is-ancestor "$sha" "origin/${FEATURE}"; then
              EXCLUDED_SHAS+=("$sha")
            fi
          done
          # Ancestry order (oldest first), so each `^1` merge never pulls in a later exclusion.
          if [ "${#EXCLUDED_SHAS[@]}" -gt 0 ]; then
            pending="$(printf '%s\n' "${EXCLUDED_SHAS[@]}")"
            ordered="$(git rev-list --topo-order --reverse "origin/master" --not "origin/${FEATURE}")"
            mapfile -t EXCLUDED_SHAS < <(grep -Fxf <(printf '%s\n' "$pending") <<<"$ordered" || true)
          fi

          # Does the existing sync branch carry non-bot (human resolution) commits?
          HAS_HUMAN_WORK=0
          SYNC_EXISTS=0
          if git rev-parse --verify --quiet "origin/${SYNC_BRANCH}" >/dev/null; then
            SYNC_EXISTS=1
            # Commits unique to the sync branch are the bot's merge commit(s) plus any
            # human resolution. List their committer names and drop the bot's; whatever
            # remains is human work. (Note: --invert-grep only inverts --grep, NOT
            # --committer, so a committer filter cannot be used here.)
            if [ -n "$(git log --format='%cn' \
                        "origin/${SYNC_BRANCH}" --not "origin/${FEATURE}" "origin/master" 2>/dev/null \
                        | grep -vxF "$BOT_NAME" || true)" ]; then
              HAS_HUMAN_WORK=1
            fi
          fi

          # Was $1 recorded in the sync branch as an `-s ours` merge (tree unchanged)?
          excluded_in_sync() {
            local c p1 rest p
            while read -r c p1 rest; do
              for p in $rest; do
                if [ "$p" = "$1" ] && [ "$(git rev-parse "${c}^{tree}")" = "$(git rev-parse "${p1}^{tree}")" ]; then
                  return 0
                fi
              done
            done < <(git rev-list --parents "origin/${SYNC_BRANCH}" --not "origin/${FEATURE}")
            return 1
          }

          # An exclusion added after the sync branch already took that PR in: rebuild
          # from the target tip, dropping the sync branch (and any human resolution on it).
          TAINTED=""
          if [ "$SYNC_EXISTS" = "1" ]; then
            for sha in "${EXCLUDED_SHAS[@]}"; do
              if git merge-base --is-ancestor "$sha" "origin/${SYNC_BRANCH}" && ! excluded_in_sync "$sha"; then
                TAINTED="${TAINTED} $(git rev-parse --short "$sha")"
              fi
            done
          fi
          if [ -n "$TAINTED" ]; then
            echo "::warning::${SYNC_BRANCH} already contains excluded commit(s)${TAINTED}; rebuilding from ${FEATURE}."
            HAS_HUMAN_WORK=0
          fi

          # Conflict markers the bot committed on top of earlier human work are still
          # unresolved until a human commits after them. Re-merging on top would look
          # clean and un-draft the PR, so leave the branch alone and keep it quarantined.
          if [ "$HAS_HUMAN_WORK" = "1" ]; then
            conflicts="$(git log --format='%H%x09%cn' --grep="^${CONFLICT_TRAILER}\$" \
                           "origin/${SYNC_BRANCH}" --not "origin/${FEATURE}" "origin/master")"
            last_conflict="$(awk -F'\t' -v b="$BOT_NAME" '$2 == b { print $1; exit }' <<<"$conflicts")"
            if [ -n "$last_conflict" ] \
               && [ -z "$(git log --format='%cn' "${last_conflict}..origin/${SYNC_BRANCH}" | grep -vxF "$BOT_NAME" || true)" ]; then
              pr="$(open_pr)"
              if [ -n "$pr" ] && [ "$DRY_RUN" != "true" ]; then
                gh pr ready "$pr" --undo >/dev/null 2>&1 || true
                gh pr merge "$pr" --disable-auto >/dev/null 2>&1 || true
              fi
              note "⚠️ waiting for conflict resolution on \`${SYNC_BRANCH}\` — PR #${pr:-?} kept as draft"
              exit 0
            fi
          fi

          # --- 2. No-op guard: sync branch already contains BOTH current master and
          #        current feature tip -> don't rebuild/force-push (avoids restarting CI
          #        or dismissing a pending approval). Just ensure PR + auto-merge state. ---
          pr="$(open_pr)"
          if [ "$SYNC_EXISTS" = "1" ] && [ -z "$TAINTED" ] && [ -n "$pr" ] \
            && git merge-base --is-ancestor "origin/master" "origin/${SYNC_BRANCH}" \
            && git merge-base --is-ancestor "origin/${FEATURE}" "origin/${SYNC_BRANCH}"; then
            is_draft="$(gh pr view "$pr" --json isDraft --jq '.isDraft' 2>/dev/null || echo '')"
            if [ "$DRY_RUN" != "true" ]; then
              # The branch is confirmed current, so a `sync-failed` from an earlier run is
              # stale no matter who fixed it — this path never reaches the removal below.
              gh pr edit "$pr" --remove-label 'sync-failed' >/dev/null 2>&1 || true
              if [ "$is_draft" != "true" ]; then
                gh pr merge "$pr" --auto --merge >/dev/null 2>&1 || true
              fi
            fi
            note "up to date — PR #$pr unchanged"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            note "would sync ${incoming} commit(s) [\`$range\`] (dry-run)"
            exit 0
          fi

          # --- 3. Build the sync branch by RAW merge (ancestry-preserving). When a human
          #        resolution exists, base on the sync branch so their work is preserved. ---
          if [ "$HAS_HUMAN_WORK" = "1" ]; then
            git checkout -B "$SYNC_BRANCH" "origin/${SYNC_BRANCH}"
          else
            git checkout -B "$SYNC_BRANCH" "origin/${FEATURE}"
          fi

          CONFLICT=0
          conflict_files=""
          merge_in() {
            if git merge --no-ff --no-edit "$1"; then
              return 0
            # Test for unmerged entries via command substitution, never a pipe: under
            # `pipefail` a reader that exits early (`grep -q`) can SIGPIPE the producer,
            # and the 141 becomes the pipeline's status — reporting a conflicted merge
            # as clean and dropping us into the "non-conflict failure" branch below.
            elif [ -n "$(git ls-files -u)" ]; then
              CONFLICT=1
              conflict_files="$(git diff --name-only --diff-filter=U || true)"
              git add -A
              git commit --no-edit --trailer "$CONFLICT_TRAILER" || { git merge --abort 2>/dev/null || true; note "❌ conflict commit failed"; exit 1; }
            else
              git status --short || true
              git merge --abort 2>/dev/null || true
              note "❌ merge failed (non-conflict) — see logs"
              exit 1
            fi
          }

          # Excluded PRs: bring in master up to each one, then record it as merged
          # without its changes. A conflict stops here; once resolved, the next run
          # continues from the human's work.
          PARTIAL=""
          for sha in "${EXCLUDED_SHAS[@]}"; do
            if git merge-base --is-ancestor "$sha" HEAD; then
              continue
            fi
            merge_in "${sha}^1"
            if [ "$CONFLICT" = "1" ]; then
              PARTIAL="$(git rev-parse --short "${sha}^1")"
              break
            fi
            git merge --no-ff -s ours \
              -m "chore(automation): Exclude $(git rev-parse --short "$sha") from ${FEATURE}" \
              -m "Records '$(git log -1 --format=%s "$sha")' as merged without its changes." "$sha"
          done

          if [ -z "$PARTIAL" ]; then
            merge_in origin/master
          fi

          pr="$(open_pr)"

          # Quarantine BEFORE publishing a conflicted tree: demote an existing ready PR to
          # draft and disable any prior auto-merge, so a half-merge can never auto-land.
          if [ "$CONFLICT" = "1" ] && [ -n "$pr" ]; then
            gh pr ready "$pr" --undo >/dev/null 2>&1 || true
            gh pr merge "$pr" --disable-auto >/dev/null 2>&1 || true
          fi

          # A rejected push used to end the run with a bare git error, leaving the PR
          # quarantined (drafted, auto-merge off) but otherwise untouched — so it kept
          # advertising a stale body while the feature branch drifted. Name the cause,
          # mark the PR, and say so in the summary.
          # Compare against the ref this push replaces: when the sync branch already exists
          # HEAD can carry workflow files it already has, which are not new to this push.
          if [ "$SYNC_EXISTS" = "1" ]; then
            wf_base="origin/${SYNC_BRANCH}"
          else
            wf_base="origin/${FEATURE}"
          fi
          wf_changed="$(git diff --name-only "${wf_base}..HEAD" -- '.github/workflows' || true)"
          if ! git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
            if [ -n "$wf_changed" ] && [ "${HAS_SYNC_BOT_TOKEN:-false}" != "true" ]; then
              why="the merge updates .github/workflows/** and the default GITHUB_TOKEN may not push workflow files — provision the SYNC_BOT_TOKEN secret (see this workflow's header)"
            else
              why="see the git output above"
            fi
            echo "::error title=master-sync push rejected::${FEATURE}: ${why}"
            gh label create 'sync-failed' --color 'b60205' --description 'Automated master→feature sync could not complete' >/dev/null 2>&1 || true
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label 'sync-failed' >/dev/null 2>&1 || true
              seen="$(gh pr view "$pr" --json comments --jq "[.comments[] | select(.body | contains(\"$PMARKER\"))] | length" 2>/dev/null || echo 0)"
              if [ "${seen:-0}" = "0" ]; then
                gh pr comment "$pr" --body "$(printf '%s\n' "$PMARKER" \
                  "> [!CAUTION]" \
                  "> **This sync PR is stale.** The nightly job could not push an update: ${why}." \
                  "" \
                  "Its description below describes an older sync and must not be trusted until this is resolved. [Failing run](${RUN_URL})")" \
                  >/dev/null 2>&1 || true
              fi
            fi
            note "❌ push rejected — ${why}"
            exit 1
          fi
          [ -n "$pr" ] && gh pr edit "$pr" --remove-label 'sync-failed' >/dev/null 2>&1 || true

          # Ensure our labels exist (idempotent). '🤖 Project automation' is pre-existing;
          # create without --force so we never overwrite its established style.
          gh label create 'master-sync' --color '1d76db' --description 'Automated master→feature sync PR' --force >/dev/null 2>&1 || true
          gh label create 'conflicts'   --color 'b60205' --description 'Automated merge hit conflicts'   --force >/dev/null 2>&1 || true
          gh label create '🤖 Project automation' --color 'ededed' >/dev/null 2>&1 || true

          # --- 4. Body (printf-built; indented to stay inside the YAML block scalar). ---
          if [ "$CONFLICT" = "1" ]; then
            detail="$(printf '%s\n' \
              "> [!WARNING]" \
              "> **Merge conflicts** — opened as a **draft** so it cannot auto-merge. Resolve, then mark *Ready for review*." \
              "" \
              "Conflicted files:" \
              '```' \
              "$conflict_files" \
              '```' \
              "" \
              "Resolve locally (the merge is already committed *with* the conflict markers):" \
              '```bash' \
              "git fetch origin" \
              "git checkout ${SYNC_BRANCH}" \
              "# Open the conflicted files, resolve all <<<<<<< / ======= / >>>>>>> markers, then:" \
              "git add -u" \
              "git commit -m 'fix: resolve merge conflicts with master'" \
              "git push" \
              '```')"
          else
            detail="- Auto-merge: **enabled** — lands once required CI is green and a reviewer approves."
          fi

          extra=()
          if [ -n "$excluded_list" ]; then
            extra+=("- Release stabilization: master PRs **excluded** from this branch (recorded as merged, changes dropped):${excluded_list}")
          fi
          if [ -n "$TAINTED" ]; then
            extra+=("- **Rebuilt:** the previous sync branch already contained newly excluded commit(s)${TAINTED}, so it was rebuilt from \`${FEATURE}\`; any conflict resolution pushed to it must be redone.")
          fi
          if [ -n "$PARTIAL" ]; then
            extra+=("- **Partial:** stopped at \`${PARTIAL}\` (just before an excluded PR) because of conflicts; the next run continues after you push a resolution.")
          fi

          # PRs this sync brings in, from master's first-parent history: merge commits
          # ("Merge pull request #N", title in the body) and squash merges ("Title (#N)").
          upto="origin/master"
          if [ -n "$PARTIAL" ]; then
            upto="$PARTIAL"
          fi
          # Cap by entries and by characters: GitHub rejects bodies over 65,536 chars,
          # which would fail `gh pr create`. 50,000 leaves room for the rest of the body.
          MAX_PR_LINES=250
          PR_LIST_BUDGET=50000
          pr_lines=()
          pr_total=0
          pr_listed=0
          pr_chars=0
          pr_full=0
          for c in $(git rev-list --first-parent --reverse "$upto" --not "origin/${FEATURE}"); do
            subject="$(git show -s --format=%s "$c")"
            if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              n="${BASH_REMATCH[1]}"
              t="$(git show -s --format=%b "$c")"
              t="${t#"${t%%[![:space:]]*}"}"
              t="${t%%$'\n'*}"
            elif [[ "$subject" =~ \(\#([0-9]+)\)$ ]]; then
              n="${BASH_REMATCH[1]}"
              t="${subject% (#*}"
            else
              continue
            fi
            pr_total=$(( pr_total + 1 ))
            if [ "$pr_full" = "1" ] || [ "$pr_listed" -ge "$MAX_PR_LINES" ]; then
              pr_full=1
              continue
            fi
            # Escape & first so entities already in a title (&#64;name decodes to a
            # mention) stay literal, then < so generics like List<T> aren't swallowed as
            # HTML tags, then break @mentions with an empty comment. sed, because bash 5.2
            # expands & in ${//}.
            t="$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/@/@<!-- -->/g' <<<"$t")"
            if [[ ",${excluded_prs// /}," == *",${n},"* ]]; then
              line="- ~~#${n}~~ ${t} — _excluded_"
            else
              line="- #${n} ${t}"
            fi
            if [ $(( pr_chars + ${#line} + 1 )) -gt "$PR_LIST_BUDGET" ]; then
              pr_full=1
              continue
            fi
            pr_chars=$(( pr_chars + ${#line} + 1 ))
            pr_lines+=("$line")
            pr_listed=$(( pr_listed + 1 ))
          done
          if [ "$pr_listed" -lt "$pr_total" ]; then
            pr_lines+=("- …and $(( pr_total - pr_listed )) more, see the [full comparison](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${FEATURE}...$(git rev-parse "$upto")).")
          elif [ "$pr_total" -eq 0 ]; then
            pr_lines+=("_No PR merges in this range._")
          fi

          body="$(printf '%s\n' \
            "Automated sync — merges the latest \`master\` into \`${FEATURE}\`." \
            "" \
            "- Incoming commits from master: **${incoming}**" \
            "- Range: \`${range}\`" \
            "- Merge method: **merge commit** (preserves ancestry so future syncs stay minimal)" \
            "${extra[@]}" \
            "" \
            "${detail}" \
            "" \
            "### Included PRs (${pr_total})" \
            "" \
            "${pr_lines[@]}" \
            "" \
            "_Maintained automatically; updates in place. Generated by [this run](${RUN_URL})._")"

          # --- 5. Create or update the PR. Create with the minimum so a label/reviewer
          #        issue can never sink creation; add labels + reviewer best-effort after. ---
          if [ -z "$pr" ]; then
            if [ "$CONFLICT" = "1" ]; then
              gh pr create --base "$FEATURE" --head "$SYNC_BRANCH" --draft --title "$TITLE" --body "$body" \
                || { note "❌ PR create failed"; exit 1; }
            else
              gh pr create --base "$FEATURE" --head "$SYNC_BRANCH" --title "$TITLE" --body "$body" \
                || { note "❌ PR create failed"; exit 1; }
            fi
            pr="$(open_pr)"
          else
            gh pr edit "$pr" --title "$TITLE" --body "$body" >/dev/null \
              || echo "::warning::Could not update the description of PR #$pr; it still lists the previous sync."
            if [ "$CONFLICT" != "1" ]; then
              gh pr ready "$pr" >/dev/null 2>&1 || true
            fi
          fi

          # Labels (best-effort, idempotent).
          gh pr edit "$pr" --add-label '🤖 Project automation' --add-label 'master-sync' >/dev/null 2>&1 || true
          if [ "$CONFLICT" = "1" ]; then
            gh pr edit "$pr" --add-label 'conflicts' >/dev/null 2>&1 || true
          else
            gh pr edit "$pr" --remove-label 'conflicts' >/dev/null 2>&1 || true
          fi

          # Reviewer request (best-effort; needs read:org via SYNC_BOT_TOKEN to succeed).
          gh pr edit "$pr" --add-reviewer "$REVIEW_TEAM" >/dev/null 2>&1 || true

          if [ "$CONFLICT" = "1" ]; then
            # One-time sticky comment so a human is pinged exactly once, even under the
            # default token (which can't request a team review).
            existing="$(gh pr view "$pr" --json comments --jq "[.comments[] | select(.body | contains(\"$CMARKER\"))] | length" 2>/dev/null || echo 0)"
            if [ "${existing:-0}" = "0" ]; then
              gh pr comment "$pr" --body "$(printf '%s\n' "$CMARKER" \
                "@${REVIEW_TEAM} — \`master\` has merge conflicts into \`${FEATURE}\`. This sync PR is a draft; see its description for the resolution steps.")" \
                >/dev/null 2>&1 || true
            fi
            note "⚠️ conflicts (${incoming} commits) — draft PR #${pr:-?}"
          else
            if [ -n "$pr" ]; then
              gh pr merge "$pr" --auto --merge >/dev/null 2>&1 \
                || echo "::warning::Could not enable auto-merge on PR #$pr (check 'Allow auto-merge' / branch protection / token)."
            fi
            note "✅ synced ${incoming} commits [\`$range\`] — PR #${pr:-?}"
          fi

  backport:
    name: 'Backport: ${{ matrix.release.branch }}'
    needs: enumerate
    if: needs.enumerate.outputs.release_count != '0'
    runs-on: ubuntu-latest
    # A newer pending run for the same release replaces an older one; both would
    # pick the same set, so nothing is lost.
    concurrency:
      group: master-sync-${{ matrix.release.branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.enumerate.outputs.releases) }}
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}
      HAS_SYNC_BOT_TOKEN: ${{ secrets.SYNC_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Backport labeled PRs into ${{ matrix.release.branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          RELEASE: ${{ matrix.release.branch }}
          LABEL: ${{ matrix.release.label }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REVIEW_TEAM: unoplatform/uno-core-team
          BOT_NAME: 'github-actions[bot]'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          SYNC_BRANCH="automation/backport/${RELEASE}"
          TITLE="chore(automation): Backport ${LABEL} PRs → ${RELEASE}"
          CMARKER="<!-- master-sync-bot:backport-conflict:${RELEASE} -->"

          STATUS=""
          note() { STATUS="$1"; }
          trap '{ echo "### \`${RELEASE}\` (\`${LABEL}\`)"; echo "${STATUS:-❌ errored — see logs}"; } >> "$GITHUB_STEP_SUMMARY"' EXIT

          git config user.name "$BOT_NAME"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin master "${RELEASE}" --prune
          git fetch origin "${SYNC_BRANCH}" >/dev/null 2>&1 || true

          open_pr() { gh pr list --head "$1" --base "$RELEASE" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true; }
          # Titles go into markdown: keep entities, generics and @mentions literal.
          md_escape() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/@/@<!-- -->/g' <<<"$1"; }
          has_pick() { grep -qF "cherry picked from commit $2" <<<"$1"; }

          # The stabilization merge sync of this release is over: retire its PR.
          old_pr="$(open_pr "automation/master-sync/${RELEASE}")"
          if [ -n "$old_pr" ] && [ "$DRY_RUN" != "true" ]; then
            gh pr close "$old_pr" --delete-branch \
              --comment "\`${RELEASE}\` is in service: it now only receives master PRs labeled \`${LABEL}\`, through \`${SYNC_BRANCH}\`." || true
          fi

          # Labeled master PRs, oldest merge first.
          labeled="$(gh pr list --base master --state merged --label "$LABEL" --limit 1000 \
                       --json number,mergeCommit,mergedAt,author,title \
                       --jq 'sort_by(.mergedAt) | .[] | [.number, .mergeCommit.oid, .author.login, .title] | @tsv')" \
            || { note "❌ could not list \`${LABEL}\` PRs"; exit 1; }

          # What the release already received: merges of master (stabilization), and
          # release-only commits cherry-picked from a PR or naming its backport.
          received="$(git log --format=%B "origin/${RELEASE}" --not origin/master)"
          is_received() {
            git merge-base --is-ancestor "$2" "origin/${RELEASE}" \
              || has_pick "$received" "$2" \
              || grep -qiE "\\((partial )?backport (of )?#$1\\)" <<<"$received"
          }

          PENDING=()
          declare -A PR_NUMBER PR_TITLE PR_AUTHOR
          while IFS=$'\t' read -r n sha author title; do
            [ -z "${n:-}" ] && continue
            if [ -z "$sha" ] || ! git merge-base --is-ancestor "$sha" origin/master 2>/dev/null; then
              echo "::warning::#${n} is labeled ${LABEL} but its merge commit is not on master; skipped."
              continue
            fi
            if is_received "$n" "$sha"; then
              continue
            fi
            PENDING+=("$sha")
            PR_NUMBER[$sha]="$n"
            PR_TITLE[$sha]="$title"
            PR_AUTHOR[$sha]="$author"
          done <<<"$labeled"
          echo "Pending: ${#PENDING[@]} PR(s)"

          # A live sync branch is reused, so commits people pushed to it survive.
          SYNC_EXISTS=0
          HAS_HUMAN_WORK=0
          STALE=""
          if git rev-parse --verify --quiet "origin/${SYNC_BRANCH}" >/dev/null \
             && ! git merge-base --is-ancestor "origin/${SYNC_BRANCH}" "origin/${RELEASE}"; then
            SYNC_EXISTS=1
            if [ -n "$(git log --format='%cn' "origin/${SYNC_BRANCH}" --not "origin/${RELEASE}" | grep -vxF "$BOT_NAME" || true)" ]; then
              HAS_HUMAN_WORK=1
            fi
            # Picks no longer wanted: unlabeled, or received another way meanwhile.
            while read -r picked; do
              [ -z "$picked" ] && continue
              if [[ " ${PENDING[*]} " != *" ${picked} "* ]]; then
                STALE="${STALE} $(git rev-parse --short "$picked")"
              fi
            done < <(git log --format=%B "origin/${SYNC_BRANCH}" --not "origin/${RELEASE}" \
                       | sed -n 's/^(cherry picked from commit \([0-9a-f]\{40\}\))$/\1/p')
          fi

          if [ "${#PENDING[@]}" -eq 0 ] && [ "$SYNC_EXISTS" = "0" ]; then
            note "nothing to backport"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            note "would backport ${#PENDING[@]} PR(s) (dry-run)"
            exit 0
          fi

          # Rebuilding would drop the commits people pushed, and keeping the branch would
          # land the unwanted picks: stop it from merging and ask for a hand cleanup.
          if [ -n "$STALE" ] && [ "$HAS_HUMAN_WORK" = "1" ]; then
            SMARKER="<!-- master-sync-bot:backport-stale -->"
            pr="$(open_pr "$SYNC_BRANCH")"
            if [ -n "$pr" ]; then
              gh pr merge "$pr" --disable-auto >/dev/null 2>&1 || true
              gh pr ready "$pr" --undo >/dev/null 2>&1 || true
              gh label create 'sync-failed' --color 'b60205' --description 'Automated master→feature sync could not complete' >/dev/null 2>&1 || true
              gh pr edit "$pr" --add-label 'sync-failed' >/dev/null 2>&1 || true
              seen="$(gh pr view "$pr" --json comments --jq "[.comments[] | select(.body | contains(\"$SMARKER\"))] | length" 2>/dev/null || echo 0)"
              if [ "${seen:-0}" = "0" ]; then
                gh pr comment "$pr" --body "$(printf '%s\n' "$SMARKER" \
                  "> [!CAUTION]" \
                  "> This branch carries picks that are no longer wanted (label removed, or backported another way):${STALE}. It also has commits pushed by hand, so the bot will not rebuild it; this PR is a draft with auto-merge off until it is cleaned up." \
                  "" \
                  "Drop those picks from \`${SYNC_BRANCH}\` (e.g. an interactive rebase) and force-push, or delete the branch to let the next run rebuild it without your commits. [Run](${RUN_URL})")" \
                  >/dev/null 2>&1 || true
              fi
            fi
            echo "::error title=backport needs cleanup::${SYNC_BRANCH} has hand-pushed commits and unwanted picks:${STALE}"
            note "❌ unwanted picks${STALE} on a branch with hand-pushed commits — PR #${pr:-?} quarantined, clean it up by hand"
            exit 1
          fi

          if [ "$SYNC_EXISTS" = "1" ] && [ -z "$STALE" ] && [ "$HAS_HUMAN_WORK" = "1" ]; then
            git checkout -B "$SYNC_BRANCH" "origin/${SYNC_BRANCH}"
            if ! git merge-base --is-ancestor "origin/${RELEASE}" HEAD \
               && ! git merge --no-ff --no-edit "origin/${RELEASE}"; then
              git merge --abort 2>/dev/null || true
              note "❌ \`${RELEASE}\` conflicts with the commits pushed to \`${SYNC_BRANCH}\`; merge it in by hand"
              exit 1
            fi
          elif [ "$SYNC_EXISTS" = "1" ] && [ -z "$STALE" ] \
               && git merge-base --is-ancestor "origin/${RELEASE}" "origin/${SYNC_BRANCH}"; then
            git checkout -B "$SYNC_BRANCH" "origin/${SYNC_BRANCH}"
          else
            if [ -n "$STALE" ]; then
              echo "::warning::${SYNC_BRANCH} carries picks no longer wanted:${STALE}; rebuilding from ${RELEASE}."
            fi
            git checkout -B "$SYNC_BRANCH" "origin/${RELEASE}"
          fi
          start="$(git rev-parse HEAD)"

          # Cherry-pick what the branch lacks. A conflicting PR is left out rather than
          # committed with markers, so it cannot block the PRs after it.
          onbranch="$(git log --format=%B HEAD --not "origin/${RELEASE}")"
          CONFLICTED=()
          declare -A CONFLICT_FILES
          for sha in "${PENDING[@]}"; do
            if has_pick "$onbranch" "$sha"; then
              continue
            fi
            read -ra parents <<<"$(git rev-list --parents -n 1 "$sha")"
            args=(-x)
            if [ "${#parents[@]}" -gt 2 ]; then
              args+=(-m 1)
            fi
            if git cherry-pick "${args[@]}" "$sha"; then
              continue
            fi
            if [ -z "$(git ls-files -u)" ] && git diff --cached --quiet; then
              # Its changes are already there.
              git cherry-pick --skip
              continue
            fi
            CONFLICT_FILES[$sha]="$(git diff --name-only --diff-filter=U || true)"
            git cherry-pick --abort
            CONFLICTED+=("$sha")
          done
          picked_now="$(git rev-list --count "${start}..HEAD")"

          # Ping each conflicting PR's author, once per release.
          for sha in "${CONFLICTED[@]}"; do
            n="${PR_NUMBER[$sha]}"
            seen="$(gh pr view "$n" --json comments --jq "[.comments[] | select(.body | contains(\"$CMARKER\"))] | length" 2>/dev/null || echo 0)"
            if [ "${seen:-0}" != "0" ]; then
              continue
            fi
            who="${PR_AUTHOR[$sha]}"
            if [[ "$who" == app/* ]]; then
              who="$REVIEW_TEAM"
            fi
            gh pr comment "$n" --body "$(printf '%s\n' "$CMARKER" \
              "@${who} — this PR is labeled \`${LABEL}\` but does not cherry-pick cleanly onto \`${RELEASE}\`. Conflicting files:" \
              "" \
              "$(sed 's/^/- `/; s/$/`/' <<<"${CONFLICT_FILES[$sha]}")" \
              "" \
              "Please backport it by hand: open a PR against \`${RELEASE}\` with \`(backport #${n})\` in its title (\`@Mergifyio backport ${RELEASE}\` does that for you). Or remove the label if it should not be backported.")" \
              >/dev/null 2>&1 || true
          done

          conflict_lines=()
          conflict_note=""
          for sha in "${CONFLICTED[@]}"; do
            conflict_lines+=("- #${PR_NUMBER[$sha]} $(md_escape "${PR_TITLE[$sha]}") — conflicts in $(paste -sd, <<<"${CONFLICT_FILES[$sha]}" | sed 's/,/, /g')")
          done
          if [ "${#CONFLICTED[@]}" -gt 0 ]; then
            conflict_note=", ${#CONFLICTED[@]} need a manual backport"
          fi

          pr="$(open_pr "$SYNC_BRANCH")"

          # Nothing left to bring in: retire the PR and branch.
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${RELEASE}")" ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "Nothing left to backport into \`${RELEASE}\`; closing." || true
            elif [ "$SYNC_EXISTS" = "1" ]; then
              git push origin --delete "$SYNC_BRANCH" || true
            fi
            note "nothing to backport${conflict_note}"
            exit 0
          fi

          if [ "$SYNC_EXISTS" = "0" ] || [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${SYNC_BRANCH}")" ]; then
            if ! git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
              why="see the git output above"
              if [ -n "$(git diff --name-only "origin/${RELEASE}..HEAD" -- '.github/workflows')" ] && [ "${HAS_SYNC_BOT_TOKEN:-false}" != "true" ]; then
                why="a backported PR updates .github/workflows/** and the default GITHUB_TOKEN may not push workflow files — provision the SYNC_BOT_TOKEN secret (see this workflow's header)"
              fi
              echo "::error title=backport push rejected::${RELEASE}: ${why}"
              if [ -n "$pr" ]; then
                gh label create 'sync-failed' --color 'b60205' --description 'Automated master→feature sync could not complete' >/dev/null 2>&1 || true
                gh pr edit "$pr" --add-label 'sync-failed' >/dev/null 2>&1 || true
              fi
              note "❌ push rejected — ${why}"
              exit 1
            fi
          fi
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --remove-label 'sync-failed' >/dev/null 2>&1 || true
          fi

          gh label create 'master-sync' --color '1d76db' --description 'Automated master→feature sync PR' --force >/dev/null 2>&1 || true
          gh label create '🤖 Project automation' --color 'ededed' >/dev/null 2>&1 || true

          # Included = every pending PR whose pick is on the branch now, by the bot or not.
          onbranch="$(git log --format=%B HEAD --not "origin/${RELEASE}")"
          pr_lines=()
          for sha in "${PENDING[@]}"; do
            if has_pick "$onbranch" "$sha"; then
              pr_lines+=("- #${PR_NUMBER[$sha]} $(md_escape "${PR_TITLE[$sha]}")")
            fi
          done
          included="${#pr_lines[@]}"
          if [ "$included" -eq 0 ]; then
            pr_lines+=("_None picked by the bot; see the commits on this branch._")
          fi

          extra=()
          if [ -n "$STALE" ]; then
            extra+=("> [!NOTE]" "> **Rebuilt** from \`${RELEASE}\`: the previous branch carried picks no longer wanted (label removed, or backported another way):${STALE}." "")
          fi
          if [ "${#CONFLICTED[@]}" -gt 0 ]; then
            extra+=("### Needs a manual backport (${#CONFLICTED[@]})" "" \
              "Left out because they do not cherry-pick cleanly; their authors were asked to backport them by hand. A later PR here that builds on one of them may not compile without it." "" \
              "${conflict_lines[@]}" "")
          fi

          body="$(printf '%s\n' \
            "Automated backport — cherry-picks master PRs labeled \`${LABEL}\` into \`${RELEASE}\`." \
            "" \
            "- Auto-merge: **enabled** — lands once required CI is green and a reviewer approves." \
            "- Updates in place as PRs get the label. Remove the label from a PR to drop it from here." \
            "" \
            "### Included PRs (${included})" \
            "" \
            "${pr_lines[@]}" \
            "" \
            "${extra[@]}" \
            "_Maintained automatically. Generated by [this run](${RUN_URL})._")"

          if [ -z "$pr" ]; then
            gh pr create --base "$RELEASE" --head "$SYNC_BRANCH" --title "$TITLE" --body "$body" \
              || { note "❌ PR create failed"; exit 1; }
            pr="$(open_pr "$SYNC_BRANCH")"
          else
            gh pr edit "$pr" --title "$TITLE" --body "$body" >/dev/null \
              || echo "::warning::Could not update the description of PR #$pr; it still lists the previous run."
          fi

          gh pr edit "$pr" --add-label '🤖 Project automation' --add-label 'master-sync' >/dev/null 2>&1 || true
          gh pr edit "$pr" --add-reviewer "$REVIEW_TEAM" >/dev/null 2>&1 || true
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --auto --merge >/dev/null 2>&1 \
              || echo "::warning::Could not enable auto-merge on PR #$pr (check 'Allow auto-merge' / branch protection / token)."
          fi
          note "✅ ${included} PR(s), ${picked_now} new commit(s)${conflict_note} — PR #${pr:-?}"
