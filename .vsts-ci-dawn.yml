# Builds Uno.WinUI.Composition.WebGpu.Dawn: Dawn's libraries for every native platform the WebGPU backend runs on,
# linked from Dawn's releases or built from Dawn's source where a release does not cover the platform (build/dawn).
# Runs only when build/dawn changes; a new Dawn version is a change to build/dawn/version.json.
trigger:
  branches:
    include:
      - master
      - feature/*
  paths:
    include:
      - build/dawn/**
      - .vsts-ci-dawn.yml

pr:
  branches:
    include:
      - master
      - feature/*
  paths:
    include:
      - build/dawn/**
      - .vsts-ci-dawn.yml

variables:
  dawnCache: '$(Agent.TempDirectory)/dawn'

stages:
- stage: Dawn
  displayName: Dawn native libraries
  jobs:

  - job: Windows
    displayName: Windows x64 and arm64 (from source, static C++ runtime)
    timeoutInMinutes: 120
    pool:
      vmImage: windows-2022
    steps:
    - checkout: self
      fetchDepth: 1
    - pwsh: |
        python build/dawn/fetch.py headers "$(dawnCache)" | Tee-Object -Variable headers
        python build/dawn/exports.py "$headers/include/dawn/webgpu.h" "$(dawnCache)/exports"
        foreach ($arch in 'x64', 'arm64') {
          ./build/dawn/build-source-windows.ps1 -Source "$(dawnCache)/src" -Arch $arch -Prefix "$(dawnCache)/install-$arch"
          ./build/dawn/link-windows.ps1 -Lib "$(dawnCache)/install-$arch/lib/webgpu_dawn.lib" -Exports "$(dawnCache)/exports" -Arch $arch -Out "$(Build.ArtifactStagingDirectory)/win-$arch"
        }
      displayName: Build and link
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: dawn-windows

  - job: Linux
    displayName: Linux x64, Android
    timeoutInMinutes: 60
    pool:
      # The oldest image the package supports: the link binds glibc symbol versions.
      vmImage: ubuntu-22.04
    steps:
    - checkout: self
      fetchDepth: 1
    - bash: |
        set -euo pipefail
        sudo apt-get install -y -qq clang
        out="$(Build.ArtifactStagingDirectory)"
        headers=$(python3 build/dawn/fetch.py headers "$(dawnCache)")
        python3 build/dawn/exports.py "$headers/include/dawn/webgpu.h" "$(dawnCache)/exports"
        ubuntu=$(python3 build/dawn/fetch.py ubuntu "$(dawnCache)")
        bash build/dawn/link-linux.sh "$ubuntu/lib64/libwebgpu_dawn.a" "$(dawnCache)/exports" "$out/linux-x64"
        android=$(python3 build/dawn/fetch.py android "$(dawnCache)")
        bash build/dawn/link-android.sh "$android" "$(dawnCache)/exports" "$out"
      displayName: Link
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: dawn-linux

  - job: LinuxArm64
    displayName: Linux arm64 (from source)
    timeoutInMinutes: 120
    pool:
      # Dawn needs a recent clang; the Ubuntu 22.04 sysroot sets the glibc floor, not this image.
      vmImage: ubuntu-24.04
    steps:
    - checkout: self
      fetchDepth: 1
    - bash: |
        set -euo pipefail
        sudo apt-get install -y -qq clang lld llvm ninja-build
        headers=$(python3 build/dawn/fetch.py headers "$(dawnCache)")
        python3 build/dawn/exports.py "$headers/include/dawn/webgpu.h" "$(dawnCache)/exports"
        bash build/dawn/make-sysroot.sh "$(dawnCache)/sysroot-arm64"
        bash build/dawn/build-source-linux.sh "$(dawnCache)/src" "$(dawnCache)/sysroot-arm64" "$(dawnCache)/install-arm64"
        bash build/dawn/link-linux.sh "$(dawnCache)/install-arm64/libwebgpu_dawn.a" "$(dawnCache)/exports" "$(Build.ArtifactStagingDirectory)/linux-arm64" aarch64-linux-gnu "$(dawnCache)/sysroot-arm64"
      displayName: Build and link
    - bash: |
        set -euo pipefail
        # Dawn's license and those of the dependencies fetched into the source tree, for the package.
        cd "$(dawnCache)/src"
        mkdir -p "$(Build.ArtifactStagingDirectory)/licenses"
        find . -maxdepth 4 -type f \( -path ./LICENSE -o -path './third_party/*/LICENSE*' -o -path './third_party/*/src/LICENSE*' \) -exec cp --parents {} "$(Build.ArtifactStagingDirectory)/licenses" \;
        cp -r "$(dawnCache)/exports" "$(Build.ArtifactStagingDirectory)/exports"
      displayName: Collect licenses and exports
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: dawn-linux-arm64

  - job: Apple
    displayName: macOS and iOS
    timeoutInMinutes: 60
    pool:
      vmImage: macOS-15
    steps:
    - checkout: self
      fetchDepth: 1
    - bash: |
        set -euo pipefail
        headers=$(python3 build/dawn/fetch.py headers "$(dawnCache)")
        python3 build/dawn/exports.py "$headers/include/dawn/webgpu.h" "$(dawnCache)/exports"
        apple=$(python3 build/dawn/fetch.py apple "$(dawnCache)")
        bash build/dawn/link-apple.sh "$apple" "$(dawnCache)/exports" "$(Build.ArtifactStagingDirectory)"
      displayName: Link
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: dawn-apple

  - job: Pack
    dependsOn: [Windows, Linux, LinuxArm64, Apple]
    pool:
      vmImage: ubuntu-22.04
    steps:
    - checkout: self
      fetchDepth: 1
    - download: current
    - bash: |
        set -euo pipefail
        payload="$(Agent.TempDirectory)/payload"
        mkdir -p "$payload"
        for a in dawn-windows dawn-linux dawn-linux-arm64 dawn-apple; do
          for d in "$(Pipeline.Workspace)/$a"/*/; do
            case "$(basename "$d")" in licenses|exports) ;; *) cp -r "$d" "$payload/" ;; esac
          done
        done
        python3 build/dawn/pack.py "$payload" "$(Pipeline.Workspace)/dawn-linux-arm64/exports" "$(Pipeline.Workspace)/dawn-linux-arm64/licenses" "$(Build.ArtifactStagingDirectory)"
      displayName: Pack
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: nuget-packages

- stage: Publish
  dependsOn: Dawn
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - template: build/ci/publish/.azure-devops-publish-nuget-dev.yml
    parameters:
      vmImage: ubuntu-22.04
